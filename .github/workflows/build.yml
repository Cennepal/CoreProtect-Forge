name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Game tests
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ./gradlew runGameTestServer
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect
          path: build/libs/CoreProtect-*-forge.jar
