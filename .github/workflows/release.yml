name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v24.1.0-forge'
        required: true
permissions:
  contents: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Game tests
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ./gradlew runGameTestServer
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run creates the tag on the commit it was started from.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CoreProtect ${{ inputs.tag || github.ref_name }} for Forge 1.20.1
          body_path: .github/release/notes.md
          files: build/libs/CoreProtect-*-forge.jar
          fail_on_unmatched_files: true
